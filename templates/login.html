{% extends "base.html" %}
{% block title %}Sign in · Relay{% endblock %}
{% block main_class %}page page-center{% endblock %}
{% block content %}
<div class="login-card">
  <div class="login-brand"><span class="brand-dot" aria-hidden="true"></span>RELAY</div>
  <p class="login-sub">Post to Discord without showing your hand.</p>
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" autofocus required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button class="btn btn-primary btn-block" type="submit">Sign in</button>
  </form>
</div>
{% endblock %}
