{% extends "base.html" %}
{% block title %}Account · Relay{% endblock %}
{% block main_class %}page page-center{% endblock %}
{% block content %}
<div class="login-card">
  <h1>Change password</h1>
  <p class="muted">Signed in as <span class="strong">{{ g.user.username }}</span></p>
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label for="current">Current password</label>
    <input id="current" name="current" type="password" autocomplete="current-password" required>
    <label for="new">New password <span class="hint">at least 8 characters</span></label>
    <input id="new" name="new" type="password" minlength="8" autocomplete="new-password" required>
    <button class="btn btn-primary btn-block" type="submit">Change password</button>
  </form>
</div>
{% endblock %}
